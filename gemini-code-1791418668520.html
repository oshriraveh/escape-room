                                        <p class="text-slate-700 leading-relaxed text-lg">המורה נכנסה לכיתה ב־7:42 וסידרה את המחברות שלה בשתי ערימות.<br>ב־7:50 היא בדקה שכל הכיסאות פונים ללוח.<br>ב־7:58 היא כתבה על הלוח את המילה "סדר".<br>ב־8:03 היא יצאה להביא קפה.<br>ב־8:07 היא חזרה ושאלה מי נגע בדברים שלה.</p>
                                    </div>

                                    <div class="p-8 bg-slate-50 rounded-3xl border-2 border-slate-200 space-y-3 shadow-sm">
                                        <p class="font-black text-amber-800 text-xl">דיווח יום - 6.10.2026</p>
                                        <p class="text-slate-700 leading-relaxed text-lg">ב־7:51 המורה סידרה את הכיסאות ב־שורות.<br>ב־7:56 היא פתחה את הקלסר שלה בעמוד האחרון.<br>ב־8:02 היא הסתכלה על השעון ואמרה: "מאוחר מדי."<br>ב־8:04 היא התחילה לבדוק את המחברות.<br>ב־8:09 היא שכחה איפה הניחה את העט שלה.</p>
                                    </div>

                                    <div class="p-8 bg-slate-50 rounded-3xl border-2 border-slate-200 space-y-3 shadow-sm">
                                        <p class="font-black text-amber-800 text-xl">דיווח יום - 7.10.2026</p>
                                        <p class="text-slate-700 leading-relaxed text-lg">המורה הגיעה ב־7:48 והניחה את התיק שלה מתחת לשולחן.<br>ב־7:55 היא סידרה את המחברות לפי גודל.<br>ב־8:01 היא פתחה את החלון.<br>ב־8:06 היא הסתכלה על הכיתה במשך כמה שניות בלי להגיד כלום.<br>ב־8:10 היא חזרה לשולחן שלה.</p>
                                    </div>

                                    <div class="p-8 bg-slate-50 rounded-3xl border-2 border-slate-200 space-y-3 shadow-sm">
                                        <p class="font-black text-amber-800 text-xl">דיווח יום - 8.10.2026</p>
                                        <p class="text-slate-700 leading-relaxed text-lg">
                                            המורה סידרה הכל ב<strong>טורים</strong>, גם את הכיסאות<br>
                                            בכיתה ב-7:55 וגם את המחברות שלה ב-8:00.<br>
                                            "תסתכלי" המורה אמרה ב-8:05 ואז היא הסתכלה<br>
                                            בקפה! (ב-8:06)...
                                        </p>
                                    </div>
                                </div>
                            </div>
                        `
                    }
                ]
            }
        };

        const noteItem = {
            id: "note_doc",
            name: "הערה",
            type: "doc",
            icon: "fa-file-lines",
            color: "text-blue-600",
            bg: "bg-blue-50",
            content: `
                <div class="max-w-5xl mx-auto bg-white shadow-2xl rounded-3xl p-12 md:p-16 my-10 text-slate-900 border border-slate-200 text-lg md:text-xl leading-relaxed">
                    <div class="border-b border-slate-200 pb-8 mb-10 flex justify-between items-start">
                        <div>
                            <h1 class="text-3xl md:text-4xl font-black text-slate-900">הערה</h1>
                            <p class="text-base text-slate-500 mt-2 font-medium">מסמך עזר לחדר בריחה</p>
                        </div>
                        <span class="bg-blue-50 text-blue-700 text-base px-5 py-2 rounded-full font-bold border border-blue-200">Google Docs</span>
                    </div>
                    
                    <div class="bg-slate-50 border-2 border-slate-200 p-10 rounded-3xl text-xl space-y-6">
                        <p class="text-2xl"><strong>בקובץ 1:</strong> המספר של קובץ אחד הוא מספר הצורה "+".</p>
                        <p class="text-2xl"><strong>בקובץ 2:</strong> מספר השינויים הוא המספר.</p>
                    </div>
                </div>
            `
        };

        function renderView() {
            const container = document.getElementById('mainContainer');

            let headerHTML = `
                <div class="w-full max-w-7xl mb-10 text-center">
                    <div class="inline-block bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white px-8 py-5 rounded-3xl shadow-xl border border-slate-700/50">
                        <h1 class="text-2xl md:text-3xl font-black tracking-wide flex items-center justify-center gap-3">
                            <i class="fa-solid fa-graduation-cap text-amber-400"></i>
                            מאגר הקבצים הבית ספרי של אלין ורטמן
                            <i class="fa-solid fa-graduation-cap text-amber-400"></i>
                        </h1>
                    </div>
                </div>
            `;

            if (currentFolder === null) {
                let html = headerHTML + `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-8 w-full max-w-7xl pt-2">`;

                for (let i = 1; i <= 4; i++) {
                    const isLocked = (currentMode === 'tv' && i > 1);
                    html += `
                        <div class="flex flex-col gap-3">
                            ${isLocked ? '<div class="bg-slate-900 text-white text-sm px-4 py-2 rounded-xl font-bold flex items-center justify-center gap-2 shadow-md w-full"><i class="fa-solid fa-lock text-amber-400"></i> קובץ נעול</div>' : '<div class="h-[38px]"></div>'}
                            <div onclick="openFolder(${i})" class="group bg-white rounded-3xl p-8 border-2 border-slate-200 shadow-xl hover:shadow-2xl hover:border-amber-400 transition-all duration-300 cursor-pointer flex flex-col justify-between relative overflow-hidden h-64">
                                <div class="flex items-center justify-between z-10">
                                    <div class="w-20 h-20 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center text-4xl shadow-inner group-hover:scale-110 transition-transform">
                                        <i class="fa-solid fa-folder"></i>
                                    </div>
                                </div>
                                <h4 class="font-black text-slate-900 text-2xl group-hover:text-amber-600 transition-colors z-10">קובץ ${i}</h4>
                            </div>
                        </div>
                    `;
                }

                const isNoteLocked = (currentMode === 'tv');
                html += `
                    <div class="flex flex-col gap-3">
                        ${isNoteLocked ? '<div class="bg-slate-900 text-white text-sm px-4 py-2 rounded-xl font-bold flex items-center justify-center gap-2 shadow-md w-full"><i class="fa-solid fa-lock text-amber-400"></i> מסמך נעול</div>' : '<div class="h-[38px]"></div>'}
                        <div onclick="openItem('note_doc')" class="group bg-white rounded-3xl p-8 border-2 border-slate-200 shadow-xl hover:shadow-2xl hover:border-blue-400 transition-all duration-300 cursor-pointer flex flex-col justify-between relative overflow-hidden h-64">
                            <div class="flex items-center justify-between z-10">
                                <div class="w-20 h-20 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-4xl shadow-inner group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-file-lines"></i>
                                </div>
                            </div>
                            <h4 class="font-black text-slate-900 text-2xl group-hover:text-blue-600 transition-colors z-10">הערה</h4>
                        </div>
                    </div>
                `;

                html += `</div>`;
                container.innerHTML = html;

            } else {
                const folder = folderContents[currentFolder];
                let html = headerHTML + `
                    <div class="w-full max-w-7xl mb-8 flex items-center justify-between">
                        <button onclick="goHome()" class="text-lg bg-white hover:bg-slate-100 text-slate-800 px-8 py-4 rounded-2xl border-2 border-slate-300 shadow-md flex items-center gap-3 transition cursor-pointer font-bold">
                            <i class="fa-solid fa-arrow-right text-xl"></i>
                            חזרה לתיקייה ראשית
                        </button>
                        <h2 class="text-3xl font-black text-slate-900">קובץ ${currentFolder}</h2>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10 w-full max-w-7xl">
                `;

                folder.items.forEach(item => {
                    html += `
                        <div onclick="openItem('${item.id}')" class="group bg-white rounded-3xl p-10 border-2 border-slate-200 shadow-xl hover:shadow-2xl hover:border-amber-400 transition-all duration-300 cursor-pointer flex flex-col justify-between relative overflow-hidden h-72">
                            <div class="flex items-center justify-between">
                                <div class="w-24 h-24 rounded-3xl ${item.bg} ${item.color} flex items-center justify-center text-5xl shadow-inner group-hover:scale-110 transition-transform">
                                    <i class="fa-solid ${item.icon}"></i>
                                </div>
                            </div>
                            <h4 class="font-black text-slate-900 text-3xl group-hover:text-amber-600 transition-colors">${item.name}</h4>
                        </div>
                    `;
                });

                html += `</div>`;
                container.innerHTML = html;
            }
        }

        function openFolder(folderId) {
            if (currentMode === 'tv' && folderId > 1) {
                showAlert("לא ניתן לפתוח תיקייה זו במצב טלוויזיה!");
                return;
            }
            currentFolder = folderId;
            renderView();
        }

        function goHome() {
            currentFolder = null;
            renderView();
        }

        function openItem(itemId) {
            if (currentMode === 'tv' && (currentFolder === null || currentFolder > 1 || itemId === 'note_doc')) {
                showAlert("לא ניתן לצפות במסמך זה במצב טלוויזיה!");
                return;
            }

            let item = null;
            if (itemId === 'note_doc') {
                item = noteItem;
            } else if (currentFolder !== null) {
                item = folderContents[currentFolder].items.find(i => i.id === itemId);
            }

            if (!item) return;

            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalSubtitle').innerText = item.type === 'video' ? 'סרטון חקירה' : 'Google Docs';
            document.getElementById('modalHeaderIcon').className = `fa-solid ${item.icon}`;
            document.getElementById('modalIconBg').className = `w-12 h-12 rounded-2xl ${item.bg} ${item.color} flex items-center justify-center text-xl font-bold`;

            const modalBody = document.getElementById('modalBody');
            if (item.type === 'video') {
                modalBody.innerHTML = `
                    <div class="w-full h-full bg-slate-950 flex flex-col items-center justify-center p-6 select-none">
                        <div class="max-w-5xl w-full bg-black rounded-3xl overflow-hidden shadow-2xl relative border border-slate-800 flex flex-col items-center justify-center aspect-video">
                            <iframe class="w-full h-full" src="https://www.youtube-nocookie.com/embed/_eq0PSBtPBo?autoplay=1" referrerpolicy="strict-origin-when-cross-origin" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                        </div>
                    </div>
                `;
            } else {
                modalBody.innerHTML = `
                    <div class="flex-1 overflow-y-auto p-6 md:p-12 bg-slate-100">
                        ${item.content}
                    </div>
                `;
            }

            const overlay = document.getElementById('modalOverlay');
            const container = document.getElementById('modalContainer');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            container.classList.remove('scale-95');
            container.classList.add('scale-100');
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const container = document.getElementById('modalContainer');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            container.classList.remove('scale-100');
            container.classList.add('scale-95');
            document.getElementById('modalBody').innerHTML = '';
        }

        window.onload = function() {
            renderView();
        };
    </script>

</body>
</html>
